<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masterstroke Bank | Customer Feedback</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
   <img
    src="masterstroke-logo.png"
    alt="Masterstroke Bank"
    class="bank-logo"
    style="width: 220px !important; height: auto !important; max-width: 80%; display: block; margin: auto;"
>
</header>

    <main>
        <section class="welcome">
            <h1>Your Voice Matters.</h1>
            <p>We value your trust. Share your experience and help us serve you better.</p>
        </section>

        <section class="feedback-card">
            <h2>Share Your Experience</h2>
            <p class="subtitle">Your feedback helps us improve.</p>


<form id="feedbackForm">

    <label for="name">Your Name (Optional)</label>
    <input type="text" id="name" placeholder="Enter your name">

    <label for="email">Email Address (Optional)</label>
    <input type="email" id="email" placeholder="Enter your email">

    <label for="contact">Contact Number (Optional)</label>
    <input type="tel" id="contact" placeholder="Enter your contact number">

    <hr>

    <label>1. How likely are you to recommend Masterstroke Bank to friends and family?</label>

    <div class="number-rating" id="recommendOptions">
        <span class="rating-label">Not likely</span>
        <div class="number-buttons"></div>
        <span class="rating-label">Very likely</span>
    </div>

    <label>2. Was it easy to use our banking services?</label>

    <div class="number-rating" id="easeOptions">
        <span class="rating-label">Not easy</span>
        <div class="number-buttons"></div>
        <span class="rating-label">Very easy</span>
    </div>

    <label for="service">3. Which service did you use?</label>

    <select id="service" required>
        <option value="">Select a banking service</option>
        <option>Account Opening</option>
        <option>Money Transfer</option>
        <option>Online Banking</option>
        <option>Mobile Banking</option>
        <option>Customer Support</option>
        <option>ATM Services</option>
        <option>Loan Services</option>
        <option>Other</option>
    </select>

    <label for="feedback">Additional Feedback or Suggestions</label>

    <textarea id="feedback" rows="5"
        placeholder="Tell us how we can improve..."
        required></textarea>

    <button type="submit" id="submitBtn">
        Submit Feedback
    </button>

    <p id="status"></p>

</form>

        </section>
    </main>

    <footer>
        © 2026 Masterstroke Bank. All Rights Reserved.
        <p>Your Money. Your Masterstroke.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
